name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Node 22.17 runs the TypeScript test files via --experimental-strip-types,
          # matching the local toolchain exactly. No build step or extra deps.
          node-version: 22.17.0
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Check release version metadata
        run: npm run check:versions

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    env:
      # Expo's CLI phones home to a US endpoint by default; disable it so builds
      # are network-independent and don't stall behind a blocked host.
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.17.0
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # The android/ project is NOT committed; generate it fresh from app.json
      # on every build so a stale native tree can never break the build.
      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install --clean

      - name: Setup signing
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* && -n "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Signing: production keystore"
          else
            echo "Signing: expo's default debug keystore (fine for sideloading)"
          fi

      - name: Build APK
        id: build
        working-directory: android
        # On failure, publish the Gradle error as a check-run annotation
        # (readable anonymously via the check-runs API) so the reason does not
        # require authenticated log access to diagnose.
        run: |
          set +e
          ./gradlew assembleRelease --stacktrace 2>&1 | tee /tmp/gradle.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            {
              echo "### key lines ###"
              grep -n -E "FAILURE:|What went wrong|Execution failed|> Task .* FAILED|^e: |error:|Could not (resolve|find|determine|download|create)|Caused by|A problem occurred|Duplicate|Cannot|OutOfMemory|Task :.* FAILED" /tmp/gradle.log | head -n 40
              echo "### clean tail ###"
              grep -v $'^\tat ' /tmp/gradle.log | tail -n 60
            } > /tmp/summary.log 2>&1
            echo "::error title=Gradle failed::$(tr '\n' '~' < /tmp/summary.log | head -c 60000)"
            exit $status
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          overwrite: true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app-release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: app-release.apk
          generate_release_notes: true
